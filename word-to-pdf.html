<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORD TO PDF - EEN CONVERT</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f0f0f;
    color:white;
    min-height:100vh;
}

.header{
    background:#181818;
    padding:15px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid #2d2d2d;
}

.back-btn{
    text-decoration:none;
    color:#00d26a;
    font-size:20px;
    font-weight:bold;
}

.title{
    font-size:18px;
    font-weight:bold;
}

.container{
    padding:15px;
}

.card{
    background:#1b1b1b;
    border:1px solid #2d2d2d;
    border-radius:15px;
    padding:15px;
}

input[type=file],
input[type=text]{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2a2a2a;
    color:white;
    margin-top:10px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.convert-btn{
    background:#00d26a;
    color:white;
}

.download-btn{
    background:#2196F3;
    color:white;
    display:none;
}

.share-btn{
    background:#ff9800;
    color:white;
    display:none;
}

.preview{
    margin-top:15px;
    background:white;
    color:black;
    border-radius:10px;
    padding:15px;
    max-height:400px;
    overflow:auto;
}

.status{
    text-align:center;
    margin-top:15px;
    color:#00d26a;
}
</style>
</head>
<body>

<script>
if(localStorage.getItem("login") !== "true"){
    window.location.href="index.html";
}
</script>

<div class="header">
    <a href="home.html" class="back-btn">←</a>
    <div class="title">WORD TO PDF</div>
</div>

<div class="container">

<div class="card">

<label>Pilih File Word (.docx)</label>

<input
type="file"
id="wordFile"
accept=".docx">

<input
type="text"
id="filename"
placeholder="Nama PDF"
value="hasil-word">

<button
class="convert-btn"
onclick="convertWordToPDF()">
CONVERT TO PDF
</button>

<button
id="downloadBtn"
class="download-btn"
onclick="downloadPDF()">
DOWNLOAD PDF
</button>

<button
id="shareBtn"
class="share-btn"
onclick="sharePDF()">
SHARE PDF
</button>

<div
id="status"
class="status">
</div>

<div
id="preview"
class="preview">
Preview dokumen akan muncul di sini...
</div>

</div>

</div>

<script>

let pdfBlob = null;
let documentText = "";

document.getElementById("wordFile").addEventListener("change", async function(){

    const file = this.files[0];

    if(!file) return;

    try{

        const arrayBuffer =
        await file.arrayBuffer();

        const result =
        await mammoth.convertToHtml({
            arrayBuffer: arrayBuffer
        });

        document.getElementById("preview").innerHTML =
        result.value;

        const temp =
        document.createElement("div");

        temp.innerHTML = result.value;

        documentText =
        temp.innerText;

    }catch(err){

        console.error(err);

        document.getElementById("status").innerText =
        "❌ Gagal membaca file Word";

    }

});

async function convertWordToPDF(){

    if(!documentText){

        alert("Pilih file Word terlebih dahulu");

        return;
    }

    try{

        document.getElementById("status").innerText =
        "Membuat PDF...";

        const { jsPDF } = window.jspdf;

        const pdf =
        new jsPDF();

        const lines =
        pdf.splitTextToSize(
            documentText,
            180
        );

        let y = 20;

        for(let i=0;i<lines.length;i++){

            if(y > 280){

                pdf.addPage();

                y = 20;
            }

            pdf.text(
                lines[i],
                15,
                y
            );

            y += 8;
        }

        pdfBlob =
        pdf.output("blob");

        document.getElementById("downloadBtn").style.display =
        "block";

        document.getElementById("shareBtn").style.display =
        "block";

        document.getElementById("status").innerText =
        "✅ PDF berhasil dibuat";

    }catch(err){

        console.error(err);

        document.getElementById("status").innerText =
        "❌ " + err.message;

    }

}

function downloadPDF(){

    if(!pdfBlob) return;

    const filename =
    document.getElementById("filename").value.trim() ||
    "hasil-word";

    const link =
    document.createElement("a");

    link.href =
    URL.createObjectURL(pdfBlob);

    link.download =
    filename + ".pdf";

    link.click();

}

async function sharePDF(){

    try{

        if(!pdfBlob) return;

        const filename =
        document.getElementById("filename").value.trim() ||
        "hasil-word";

        const file =
        new File(
            [pdfBlob],
            filename + ".pdf",
            {
                type:"application/pdf"
            }
        );

        if(
            navigator.canShare &&
            navigator.canShare({
                files:[file]
            })
        ){

            await navigator.share({
                title:"EEN CONVERT",
                files:[file]
            });

        }else{

            alert(
            "Fitur share tidak didukung perangkat ini."
            );

        }

    }catch(err){

        console.error(err);

    }

}
</script>

</body>
</html>
