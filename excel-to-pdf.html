<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXCEL TO PDF - EEN CONVERT</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f0f0f;
    color:white;
    min-height:100vh;
}

.header{
    background:#181818;
    padding:15px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid #2d2d2d;
}

.back-btn{
    text-decoration:none;
    color:#00d26a;
    font-size:20px;
    font-weight:bold;
}

.title{
    font-size:18px;
    font-weight:bold;
}

.container{
    padding:15px;
}

.card{
    background:#1b1b1b;
    border:1px solid #2d2d2d;
    border-radius:15px;
    padding:15px;
}

input[type=file],
input[type=text]{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2a2a2a;
    color:white;
    margin-top:10px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    margin-top:10px;
}

.convert-btn{
    background:#00d26a;
    color:white;
}

.download-btn{
    background:#2196F3;
    color:white;
    display:none;
}

.share-btn{
    background:#ff9800;
    color:white;
    display:none;
}

.status{
    text-align:center;
    margin-top:15px;
    color:#00d26a;
}

.preview{
    margin-top:15px;
}

.sheet{
    background:white;
    color:black;
    border-radius:10px;
    padding:10px;
    margin-bottom:15px;
    overflow:auto;
}

.sheet-title{
    font-weight:bold;
    margin-bottom:10px;
}

table{
    border-collapse:collapse;
    width:100%;
}

table td,
table th{
    border:1px solid #ccc;
    padding:5px;
    font-size:12px;
}

</style>
</head>

<body>

<script>

if(localStorage.getItem("login") !== "true"){
    window.location.href="index.html";
}

</script>

<div class="header">

<a href="home.html" class="back-btn">
←
</a>

<div class="title">
EXCEL TO PDF
</div>

</div>

<div class="container">

<div class="card">

<label>Pilih File Excel</label>

<input
type="file"
id="excelFile"
accept=".xlsx,.xls">

<input
type="text"
id="filename"
placeholder="Nama PDF"
value="hasil-excel">

<button
class="convert-btn"
onclick="convertExcel()">
CONVERT TO PDF
</button>

<button
id="downloadBtn"
class="download-btn"
onclick="downloadPDF()">
DOWNLOAD PDF
</button>

<button
id="shareBtn"
class="share-btn"
onclick="sharePDF()">
SHARE PDF
</button>

<div
id="status"
class="status">
</div>

<div
id="preview"
class="preview">
</div>

</div>

</div>

<script>

let pdfBlob = null;
let workbookData = null;
async function convertExcel(){

    const file =
    document.getElementById("excelFile").files[0];

    if(!file){

        alert(
        "Pilih file Excel terlebih dahulu"
        );

        return;
    }

    try{

        document.getElementById("status").innerText =
        "Membaca Excel...";

        const data =
        await file.arrayBuffer();

        workbookData =
        XLSX.read(
            data,
            {
                type:"array"
            }
        );

        const preview =
        document.getElementById("preview");

        preview.innerHTML = "";

        workbookData.SheetNames.forEach(sheetName=>{

            const worksheet =
            workbookData.Sheets[sheetName];

            const json =
            XLSX.utils.sheet_to_json(
                worksheet,
                {
                    header:1
                }
            );

            const sheetDiv =
            document.createElement("div");

            sheetDiv.className =
            "sheet";

            let html = `
            <div class="sheet-title">
            ${sheetName}
            </div>
            <table>
            `;

            json.forEach(row=>{

                html += "<tr>";

                row.forEach(cell=>{

                    html += `
                    <td>
                    ${cell ?? ""}
                    </td>
                    `;

                });

                html += "</tr>";

            });

            html += "</table>";

            sheetDiv.innerHTML =
            html;

            preview.appendChild(
                sheetDiv
            );

        });

        await createPDF();

    }catch(err){

        console.error(err);

        document.getElementById("status").innerText =
        "❌ " + err.message;

    }

}

async function createPDF(){

    const { jsPDF } =
    window.jspdf;

    const pdf =
    new jsPDF();

    let firstPage = true;

    workbookData.SheetNames.forEach(sheetName=>{

        const worksheet =
        workbookData.Sheets[sheetName];

        const rows =
        XLSX.utils.sheet_to_json(
            worksheet,
            {
                header:1
            }
        );

        if(!firstPage){

            pdf.addPage();

        }

        firstPage = false;

        pdf.setFontSize(16);

        pdf.text(
            sheetName,
            14,
            15
        );

        const head =
        rows.length
        ? [rows[0]]
        : [[]];

        const body =
        rows.slice(1);

        pdf.autoTable({

            head: head,

            body: body,

            startY: 25,

            styles:{
                fontSize:8
            }

        });

    });

    pdfBlob =
    pdf.output("blob");

    document.getElementById("downloadBtn").style.display =
    "block";

    document.getElementById("shareBtn").style.display =
    "block";

    document.getElementById("status").innerText =
    "✅ PDF berhasil dibuat";

}
function downloadPDF(){

    if(!pdfBlob){
        return;
    }

    const filename =
    document.getElementById("filename").value.trim()
    || "hasil-excel";

    const link =
    document.createElement("a");

    link.href =
    URL.createObjectURL(pdfBlob);

    link.download =
    filename + ".pdf";

    link.click();

}

async function sharePDF(){

    try{

        if(!pdfBlob){
            return;
        }

        const filename =
        document.getElementById("filename").value.trim()
        || "hasil-excel";

        const file =
        new File(
            [pdfBlob],
            filename + ".pdf",
            {
                type:"application/pdf"
            }
        );

        if(
            navigator.canShare &&
            navigator.canShare({
                files:[file]
            })
        ){

            await navigator.share({

                title:"EEN CONVERT",

                files:[file]

            });

        }else{

            alert(
            "Fitur share tidak didukung perangkat ini."
            );

        }

    }catch(err){

        console.error(err);

        alert(err.message);

    }

}

</script>

</body>
  </html>
