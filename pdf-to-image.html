<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF TO IMAGE - EEN CONVERT</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f0f0f;
color:white;
min-height:100vh;
}

.header{
background:#181818;
padding:15px;
display:flex;
align-items:center;
gap:10px;
border-bottom:1px solid #2d2d2d;
}

.back-btn{
text-decoration:none;
color:#00d26a;
font-size:18px;
font-weight:bold;
}

.title{
font-size:18px;
font-weight:bold;
}

.container{
padding:15px;
}

.card{
background:#1b1b1b;
border:1px solid #2d2d2d;
border-radius:15px;
padding:15px;
}

input[type=file],
input[type=text]{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#2a2a2a;
color:white;
margin-top:10px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.convert-btn{
background:#00d26a;
color:white;
}

.download-btn{
background:#2196F3;
color:white;
display:none;
}

.share-btn{
background:#ff9800;
color:white;
display:none;
}

.preview{
display:grid;
grid-template-columns:1fr;
gap:15px;
margin-top:15px;
}

.preview canvas{
width:100%;
border-radius:10px;
background:white;
}

.status{
margin-top:15px;
text-align:center;
color:#00d26a;
}
</style>
</head>
<body>

<script>
if(localStorage.getItem("login") !== "true"){
window.location.href="index.html";
}
</script>

<div class="header">
<a href="home.html" class="back-btn">←</a>
<div class="title">PDF TO IMAGE</div>
</div>

<div class="container">

<div class="card">

<label>Pilih PDF</label>
<input type="file" id="pdfFile" accept=".pdf">

<input
type="text"
id="filename"
placeholder="Nama File"
value="hasil">

<button
class="convert-btn"
onclick="convertPDF()">
CONVERT TO IMAGE
</button>

<button
id="downloadBtn"
class="download-btn"
onclick="downloadZIP()">
DOWNLOAD ZIP
</button>

<button
id="shareBtn"
class="share-btn"
onclick="shareZIP()">
SHARE ZIP
</button>

<div id="status" class="status"></div>

<div id="preview" class="preview"></div>

</div>

</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.js";

let zipBlob = null;

async function convertPDF(){

const file =
document.getElementById("pdfFile").files[0];

if(!file){
alert("Pilih PDF terlebih dahulu");
return;
}

const preview =
document.getElementById("preview");

preview.innerHTML="";

document.getElementById("status").innerText =
"Memproses PDF...";

const pdfData = await file.arrayBuffer();

const pdf =
await pdfjsLib.getDocument({
data:pdfData
}).promise;

const zip = new JSZip();

for(let pageNum=1; pageNum<=pdf.numPages; pageNum++){

const page =
await pdf.getPage(pageNum);

const viewport =
page.getViewport({scale:2});

const canvas =
document.createElement("canvas");

const context =
canvas.getContext("2d");

canvas.width = viewport.width;
canvas.height = viewport.height;

await page.render({
canvasContext:context,
viewport:viewport
}).promise;

preview.appendChild(canvas);

const imageData =
canvas.toDataURL("image/png");

zip.file(
`${document.getElementById("filename").value || "hasil"}-page-${pageNum}.png`,
imageData.split(",")[1],
{
base64:true
}
);

document.getElementById("status").innerText =
`Memproses halaman ${pageNum}/${pdf.numPages}`;

}

zipBlob =
await zip.generateAsync({
type:"blob"
});

document.getElementById("downloadBtn").style.display =
"block";

document.getElementById("shareBtn").style.display =
"block";

document.getElementById("status").innerText =
`✅ Selesai (${pdf.numPages} halaman)`;

}

function downloadZIP(){

if(!zipBlob) return;

const filename =
document.getElementById("filename").value ||
"hasil";

const link =
document.createElement("a");

link.href =
URL.createObjectURL(zipBlob);

link.download =
filename + ".zip";

link.click();

}

async function shareZIP(){

if(!zipBlob) return;

try{

const filename =
document.getElementById("filename").value ||
"hasil";

const file =
new File(
[zipBlob],
filename + ".zip",
{
type:"application/zip"
}
);

if(
navigator.canShare &&
navigator.canShare({
files:[file]
})
){

await navigator.share({
title:"EEN CONVERT",
text:"Hasil PDF To Image",
files:[file]
});

}else{

alert(
"Perangkat tidak mendukung fitur share."
);

}

}catch(err){

console.log(err);

}

}
</script>

</body>
</html>
