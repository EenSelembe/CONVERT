<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF TO IMAGE - EEN CONVERT</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f0f0f;
    color:white;
    min-height:100vh;
}

.header{
    background:#181818;
    padding:15px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid #2d2d2d;
}

.back-btn{
    text-decoration:none;
    color:#00d26a;
    font-size:20px;
    font-weight:bold;
}

.title{
    font-size:18px;
    font-weight:bold;
}

.container{
    padding:15px;
}

.card{
    background:#1b1b1b;
    border:1px solid #2d2d2d;
    border-radius:15px;
    padding:15px;
}

input[type=file],
input[type=text]{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2a2a2a;
    color:white;
    margin-top:10px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.convert-btn{
    background:#00d26a;
    color:white;
    margin-top:10px;
}

.status{
    text-align:center;
    margin-top:15px;
    color:#00d26a;
}

.results{
    margin-top:20px;
}

.result-card{
    background:#1b1b1b;
    border:1px solid #2d2d2d;
    border-radius:15px;
    padding:12px;
    margin-bottom:15px;
}

.result-card img{
    width:100%;
    border-radius:10px;
    background:white;
}

.filename{
    margin:10px 0;
    color:#ccc;
    text-align:center;
}

.action-buttons{
    display:flex;
    gap:10px;
}

.download-btn{
    flex:1;
    background:#2196F3;
    color:white;
}

.share-btn{
    flex:1;
    background:#ff9800;
    color:white;
}
</style>
</head>
<body>

<script>
if(localStorage.getItem("login") !== "true"){
    window.location.href="index.html";
}
</script>

<div class="header">
    <a href="home.html" class="back-btn">←</a>
    <div class="title">PDF TO IMAGE</div>
</div>

<div class="container">

<div class="card">

<label>Pilih PDF</label>

<input
type="file"
id="pdfFile"
accept=".pdf">

<input
type="text"
id="filename"
placeholder="Nama File"
value="hasil">

<button
class="convert-btn"
onclick="convertPDF()">
CONVERT TO IMAGE
</button>

<div
id="status"
class="status">
</div>

</div>

<div
id="results"
class="results">
</div>

</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.js";

async function convertPDF(){

const file =
document.getElementById("pdfFile").files[0];

if(!file){
    alert("Pilih PDF terlebih dahulu");
    return;
}

const results =
document.getElementById("results");

results.innerHTML = "";

document.getElementById("status").innerText =
"Memproses PDF...";

try{

const pdfData =
await file.arrayBuffer();

const pdf =
await pdfjsLib.getDocument({
    data: pdfData
}).promise;

for(let pageNum = 1; pageNum <= pdf.numPages; pageNum++){

document.getElementById("status").innerText =
`Memproses halaman ${pageNum} dari ${pdf.numPages}`;

const page =
await pdf.getPage(pageNum);

const viewport =
page.getViewport({
    scale:1
});

const canvas =
document.createElement("canvas");

const context =
canvas.getContext("2d");

canvas.width =
viewport.width;

canvas.height =
viewport.height;

await page.render({
    canvasContext: context,
    viewport: viewport
}).promise;

const imageUrl =
canvas.toDataURL(
"image/jpeg",
0.9
);

const baseName =
document.getElementById("filename").value.trim() || "hasil";

const imageName =
`${baseName}-page-${pageNum}.jpg`;

const card =
document.createElement("div");

card.className =
"result-card";

card.innerHTML = `
<img src="${imageUrl}">
<div class="filename">${imageName}</div>

<div class="action-buttons">

<button
class="download-btn"
onclick="downloadImage('${imageUrl}','${imageName}')">
DOWNLOAD
</button>

<button
class="share-btn"
onclick="shareImage('${imageUrl}','${imageName}')">
SHARE
</button>

</div>
`;

results.appendChild(card);

}

document.getElementById("status").innerText =
`✅ Selesai. ${pdf.numPages} halaman berhasil dikonversi`;

}catch(err){

console.error(err);

document.getElementById("status").innerText =
"❌ Gagal memproses PDF" + err.message;

}

}

function downloadImage(url,name){

const a =
document.createElement("a");

a.href = url;

a.download = name;

a.click();

}

async function shareImage(url,name){

try{

const response =
await fetch(url);

const blob =
await response.blob();

const file =
new File(
[blob],
name,
{
type:"image/jpeg"
}
);

if(
navigator.canShare &&
navigator.canShare({
files:[file]
})
){

await navigator.share({
title:"EEN CONVERT",
files:[file]
});

}else{

alert(
"Fitur share tidak didukung pada perangkat ini."
);

}

}catch(err){

console.error(err);

}

}

</script>

</body>
</html>
