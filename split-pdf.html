<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Tools - Split & Merge</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: #fff;
  padding: 15px;
}

h2 { text-align: center; }

.card {
  background: #1e1e1e;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 6px;
  border: none;
}

button {
  background: #00c853;
  color: white;
  font-weight: bold;
}

button:hover {
  background: #00a844;
}

small { color: #aaa; }
</style>
</head>

<body>

<h2>PDF Tools (Split & Merge)</h2>

<div class="card">
  <h3>📂 Upload PDF</h3>
  <input type="file" id="pdfFile" accept="application/pdf">
</div>

<div class="card">
  <h3>✂️ Split PDF</h3>
  <small>Contoh: 1-3 atau 2-5</small>
  <input type="text" id="range" placeholder="Masukkan range halaman">
  <button onclick="splitPDF()">Split PDF</button>
</div>

<div class="card">
  <h3>📥 Hasil</h3>
  <div id="result"></div>
</div>

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<script>
let pdfDocGlobal = null;

document.getElementById("pdfFile").addEventListener("change", async function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const arrayBuffer = await file.arrayBuffer();
  pdfDocGlobal = await PDFLib.PDFDocument.load(arrayBuffer);

  alert("PDF berhasil dimuat!");
});

async function splitPDF() {
  if (!pdfDocGlobal) {
    alert("Upload PDF dulu!");
    return;
  }

  const range = document.getElementById("range").value.trim();
  const resultDiv = document.getElementById("result");
  resultDiv.innerHTML = "";

  if (!range.includes("-")) {
    alert("Format salah! contoh: 1-3");
    return;
  }

  let [start, end] = range.split("-").map(Number);

  if (start < 1 || end > pdfDocGlobal.getPageCount() || start > end) {
    alert("Range tidak valid!");
    return;
  }

  const pages = await pdfDocGlobal.copyPages(
    pdfDocGlobal,
    Array.from({ length: end - start + 1 }, (_, i) => start - 1 + i)
  );

  const newPdf = await PDFLib.PDFDocument.create();

  pages.forEach(p => newPdf.addPage(p));

  const pdfBytes = await newPdf.save();

  const blob = new Blob([pdfBytes], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);

  resultDiv.innerHTML = `
    <a href="${url}" download="split.pdf">
      <button>⬇️ Download Hasil Split</button>
    </a>
  `;
}
</script>

</body>
</html>
